name: Android Development Build (Dev Client)

# Produces a Development APK (debug variant) that behaves as an Expo
# Development Client. After installing this APK on a device you can connect
# it to your laptop with:
#
#   cd frontend
#   npx expo start --dev-client --clear
#
# The APK does NOT embed a JS bundle - it loads JS live from the Metro
# bundler on your machine, enabling Live Reload, Fast Refresh, the JS
# error overlay, console logs and native module debugging.

on:
  workflow_dispatch:
  push:
    branches:
      - beforeappdevelopment
    paths:
      - 'frontend/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build-dev-client-apk:
    name: Build Android Debug APK (Expo Dev Client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Give gradlew execute permission
        working-directory: frontend/android
        run: chmod +x gradlew

      # `assembleDebug` produces a Development APK using the pre-generated
      # debug keystore in frontend/android/app/debug.keystore. The React
      # Native Gradle plugin's default `debuggableVariants = ["debug"]`
      # means the JS bundle is NOT embedded and the APK will load JS from
      # Metro at runtime (this is what makes it a Dev Client APK).
      - name: Build Debug APK (assembleDebug)
        working-directory: frontend/android
        env:
          # Skip long-running JS/Hermes packaging steps that would embed
          # a bundle - they aren't needed for a Dev Client.
          EXPO_NO_TELEMETRY: "1"
          CI: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK artifact
        working-directory: frontend/android/app/build/outputs/apk/debug
        run: |
          ls -la
          if [ -f app-debug.apk ]; then
            cp app-debug.apk SafeVault-dev-client-debug.apk
          fi

      - name: Upload Development APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeVault-DevClient-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print connection instructions
        run: |
          echo "============================================================"
          echo " SafeVault Development APK built successfully"
          echo "============================================================"
          echo ""
          echo " 1. Download the artifact 'SafeVault-DevClient-Debug-APK'."
          echo " 2. Install on your Android device (USB or file transfer):"
          echo "        adb install -r SafeVault-dev-client-debug.apk"
          echo " 3. On your laptop, start Metro in dev-client mode:"
          echo "        cd frontend"
          echo "        npx expo start --dev-client --clear"
          echo " 4. Ensure the phone and laptop are on the SAME Wi-Fi network."
          echo " 5. Open the SafeVault app on the phone - the Dev Launcher"
          echo "    will appear. Either scan the QR code from Metro or tap"
          echo "    the entry that auto-discovers your dev server."
          echo ""
          echo " You will then get Live Reload, Fast Refresh, the JS error"
          echo " overlay, console logs and native module debugging."
          echo "============================================================"
